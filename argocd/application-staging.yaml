apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cloud-native-devops-staging
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/rishichourasia661-bit/cloud-native-devops-platform.git
    targetRevision: main
    path: helm/cloud-native-devops-app

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
